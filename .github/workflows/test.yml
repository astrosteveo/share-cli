name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Python 3.9 builds stop at Ubuntu 24.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The oldest Python the tests pass on, and the newest.
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
